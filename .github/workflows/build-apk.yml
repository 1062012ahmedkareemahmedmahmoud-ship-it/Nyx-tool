
name: Build LXM APK

on:
  workflow_dispatch:
  push:
    branches:
      - Worksflow

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Build APK
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug
          elif [ -f ./gradlew.bat ]; then
            echo "Android Gradle wrapper detected, but Linux build needs gradlew."
            exit 1
          else
            echo "Gradle wrapper not found in repository root."
            exit 1
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LXM-APK
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
